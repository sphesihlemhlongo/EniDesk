name: "Publish Release"
on:
  push:
    branches:
      - main
    tags:
      - 'v*' # Trigger on version tags as well

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, ubuntu-22.04, windows-latest]

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
        # Note: webkit2gtk-4.1 is required for newer Tauri versions on Ubuntu 22.04+

      - name: Install frontend dependencies
        run: cd client && npm install

      - name: Build and Publish Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: app-v__VERSION__ # the action automatically replaces this with the version from tauri.conf.json
          releaseName: "EniDesk v__VERSION__"
          releaseBody: "Automated build of EniDesk."
          releaseDraft: true
          prerelease: false
          projectPath: ./client
